[package]
name = "next_rust_deep_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.16", default-features = false, features = ["napi8"] }
napi-derive = "2.16.13"
rayon = "1.11.0"

[build-dependencies]
napi-build = "2.1.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
