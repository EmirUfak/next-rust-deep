name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Print tool versions
        run: |
          node --version
          bun --version
          node ./node_modules/eslint/bin/eslint.js --version
          rustc --version
          cargo --version

      - name: Lint TypeScript
        run: node ./node_modules/eslint/bin/eslint.js --config eslint.ci.config.mjs src tests

      - name: Run tests
        run: bun run test

      - name: Build Next.js app
        run: bun run build

      - name: Rust fmt check
        run: bun run rust:fmt:check

      - name: Rust clippy (pedantic)
        run: bun run rust:clippy

      - name: Cargo audit
        run: bun run rust:audit

      - name: Addon build verification
        run: bun run build:rust
